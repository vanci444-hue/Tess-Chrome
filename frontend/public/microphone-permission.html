<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tess · 麦克风授权</title>
  <style>
    body { margin: 0; color: #171a20; background: #fafafa; font: 16px/1.7 system-ui, sans-serif; }
    main { max-width: 560px; margin: 12vh auto; padding: 32px; }
    h1 { font-size: 28px; font-weight: 600; }
    p { color: #5c5e62; }
    button { font: inherit; background: #171a20; color: white; border: 0; border-radius: 6px; padding: 12px 24px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    button:focus-visible { outline: 3px solid #3e6ae1; outline-offset: 3px; }
    #status { white-space: pre-line; }
  </style>
  <script src="microphone-permission.js" defer></script>
</head>
<body>
  <main>
    <p>Tess</p>
    <h1>允许使用麦克风</h1>
    <p>Chrome 侧栏无法直接展示首次授权提示。请在此页完成授权，然后返回侧栏重新点击“实时转写”。</p>
    <p>本页只检查麦克风权限，授权后立即停止采音，不向服务端发送音频，也不发送会话消息。</p>
    <button id="allow" type="button">允许麦克风</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p>完成后可关闭此标签页，原侧栏的输入文字会保留。</p>
  </main>
</body>
</html>
