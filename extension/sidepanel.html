<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tess Capture</title><link rel="stylesheet" href="sidepanel.css"></head><body>
<header><small>TESS · CAPTURE SPIKE</small><h1>当前官网方案</h1><p>Alex · Tesla 销售顾问 <span>[Mock 身份]</span></p></header>
<main><form id="identity"><label>客户称呼<input id="nickname" required maxlength="60" placeholder="如 Evan"></label><label>手机号或邮箱<input id="contact" required maxlength="120" placeholder="本机保存，不进入导出文件"></label><label>本次会话<input id="session" required maxlength="80" placeholder="如 test-drive-0420"></label><button type="submit">确认客户和会话</button></form>
<section id="workspace" hidden><p id="owner"></p><button id="change" class="secondary">切换客户 / 会话</button><button id="capture">Capture 当前配置</button><p class="hint">请先在真实 Model Y 官网完成选择。金融信息需要展开贷款面板。只读网页，不修改配置。</p><div id="status" role="status" aria-live="polite"></div><div id="snapshots"></div><details id="diagnostics"><summary>本次诊断及原文证据</summary><pre id="json"></pre></details><button id="download" class="secondary" disabled>下载本次 JSON（不含联系方式）</button></section></main><script src="sidepanel.js"></script></body></html>
